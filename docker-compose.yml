services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authforge
      POSTGRES_PASSWORD: authforge
      POSTGRES_DB: authforge
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U authforge"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["${AUTHFORGE_MAILPIT_PORT:-8025}:8025"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    ports: ["${AUTHFORGE_API_PORT:-8000}:8000"]
    volumes: [signing_keys:/run/authforge-keys]
    environment:
      OAUTH_FIXTURE_URL: "http://oauth-fixture:9000"
      CORS_ALLOWED_ORIGINS: '${AUTHFORGE_CORS_ALLOWED_ORIGINS:-["http://localhost:3000"]}'
      DASHBOARD_URL: "${AUTHFORGE_PUBLIC_DASHBOARD_URL:-http://localhost:3000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_AUTHFORGE_API_URL: "${AUTHFORGE_PUBLIC_API_URL:-http://localhost:8000}"
    environment:
      AUTHFORGE_API_URL: "http://api:8000"
      NEXT_PUBLIC_AUTHFORGE_API_URL: "${AUTHFORGE_PUBLIC_API_URL:-http://localhost:8000}"
    ports: ["${AUTHFORGE_DASHBOARD_PORT:-3000}:3000"]
    depends_on: [api]
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    command: ["python", "apps/worker/authforge_worker.py"]
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}
  oauth-fixture:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["uvicorn", "main:app", "--app-dir", "apps/oauth-fixture", "--host", "0.0.0.0", "--port", "9000"]
    ports: ["${AUTHFORGE_OAUTH_FIXTURE_PORT:-9000}:9000"]
    profiles: ["test", "demo"]
volumes:
  postgres_data:
  redis_data:
  signing_keys:
